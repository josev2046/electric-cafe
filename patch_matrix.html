<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behringer K2 Pristine Patch Matrix</title>
    <style>
        :root {
            --ink: #000000;
            --paper: #fdfdfd;
            --knob-bg: #ffffff;
            --active-color: #ff3333;
        }

        body {
            background-color: #1a1a1a;
            color: var(--ink);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
        }

        /* ---------------- TOOLBAR ---------------- */
        .controls {
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #fff;
            padding: 10px 20px;
            border: 2px solid var(--ink);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-radius: 4px;
            z-index: 100;
        }

        .controls input {
            border: 2px solid var(--ink);
            padding: 8px 12px;
            width: 250px;
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 0 15px;
            border-left: 2px solid #ddd;
            border-right: 2px solid #ddd;
        }
        
        .picker-label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .color-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #ccc;
            transition: transform 0.1s;
        }
        .color-swatch.selected {
            border-color: #000;
            transform: scale(1.2);
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        button {
            background: var(--ink);
            color: var(--paper);
            border: 2px solid var(--ink);
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Helvetica Neue', sans-serif;
            letter-spacing: 1px;
        }
        button:hover { background: #444; }

        /* ---------------- CHASSIS ---------------- */
        .schematic-canvas {
            background: var(--paper);
            border: 3px solid var(--ink);
            width: 1460px;
            height: 640px;
            display: flex;
            box-sizing: border-box;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }

        /* ---------------- LEFT PANEL ---------------- */
        .left-matrix {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            flex: 0 0 600px;
            border-right: 3px solid var(--ink);
            padding: 10px 0;
        }

        .col {
            border-right: 2px solid var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 5px;
        }
        .col:last-child { border-right: none; }

        .header {
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            text-transform: uppercase;
            min-height: 24px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .divider {
            width: 100%;
            height: 2px;
            background: var(--ink);
            margin: 15px 0;
        }

        .knob-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .dial {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--ink);
            background: var(--knob-bg);
            position: relative;
            cursor: ns-resize;
            transform: rotate(-135deg);
        }

        .pointer {
            width: 0px;
            height: 16px;
            border-left: 2px solid var(--ink);
            background: transparent;
            position: absolute;
            top: 0;
            left: 16px;
        }

        .label {
            font-size: 8px;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            margin-top: 6px;
        }

        /* ---------------- RIGHT PANEL ---------------- */
        .right-matrix {
            flex: 1;
            position: relative;
        }

        .flowchart-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* SVG Typography */
        .flowchart-svg text {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: bold;
            fill: var(--ink);
            font-size: 8px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .flowchart-svg .title { font-size: 9px; letter-spacing: 0.5px; }
        .flowchart-svg .sub { font-size: 7px; fill: #444; }

        /* SVG Shapes */
        .flowchart-svg rect, .flowchart-svg circle, .flowchart-svg path, .flowchart-svg line, .flowchart-svg polygon {
            stroke: var(--ink);
            stroke-width: 1.5;
            fill: none; 
        }
        .flowchart-svg .solid { fill: var(--ink); stroke: none; }

        /* Interactive Jacks */
        .interactive-jack {
            pointer-events: auto;
            cursor: crosshair;
            stroke: var(--ink);
            stroke-width: 2px;
            fill: var(--paper);
            transition: fill 0.1s;
        }
        .interactive-jack:hover { fill: #e0e0e0; }
        .interactive-jack.active-source {
            fill: var(--active-color) !important;
            stroke-width: 3px;
        }

        /* Patch Cables */
        .patch-cable {
            pointer-events: auto !important;
            cursor: pointer;
            stroke-linecap: round;
        }
        .patch-cable:hover {
            stroke-width: 6px !important;
            opacity: 0.6;
        }

        /* HTML Overlay Knobs */
        .overlay-knob {
            position: absolute;
            z-index: 10;
            transform: translate(-50%, -50%);
        }

        /* ---------------- PRINT LAYOUT SETTINGS ---------------- */
        @media print {
            @page {
                size: landscape;
                margin: 10mm;
            }
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            body { 
                background: #fff; 
                padding: 0; 
                margin: 0; 
                display: block; 
            }
            .controls { display: none !important; }
            .schematic-canvas { 
                box-shadow: none; 
                position: absolute; 
                top: 0;
                left: 0;
                transform: scale(0.72); 
                transform-origin: top left;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" placeholder="Patch Name / Notes..." />
        
        <div class="color-picker">
            <span class="picker-label">CORD:</span>

            <div class="color-swatch" data-color="#000000" style="background:#000000;"></div>
        </div>

        <button onclick="window.print()">Print Patch Sheet</button>
        <button onclick="clearCables()" style="background:#fff; color:#000;">Clear Cords</button>
        <button onclick="resetKnobs()" style="background:#fff; color:#000;">Reset Knobs</button>
    </div>

            <div class="col">

                <div class="knob-node"><div class="dial" data-rot="-135"><div class="pointer"></div></div><div class="label">PEAK</div></div>
                <div class="divider"></div>

                <div class="knob-node"><div class="dial" data-rot="-135"><div class="pointer"></div></div><div class="label">EG2/EXT</div></div>

            <div class="overlay-knob" style="left: 210px; top: 570px;"><div class="dial" data-rot="-135"><div class="pointer"></div></div></div>
            <div class="overlay-knob" style="left: 340px; top: 570px;"><div class="dial" data-rot="135"><div class="pointer"></div></div></div>
            <div class="overlay-knob" style="left: 470px; top: 570px;"><div class="dial" data-rot="-135"><div class="pointer"></div></div></div>

    </div>

    <script>
        document.documentElement.style.setProperty('--active-color', '#ff3333');

        // 1. KNOB ROTATION LOGIC
        const dials = document.querySelectorAll('.dial');
        let activeDial = null;
        let startY = 0;
        let currentAngle = 0;

        dials.forEach(dial => {
            const rot = parseFloat(dial.getAttribute('data-rot')) || -135;
            dial.style.transform = `rotate(${rot}deg)`;
            
            dial.addEventListener('mousedown', (e) => {
                activeDial = dial;
                startY = e.clientY;
                currentAngle = parseFloat(dial.getAttribute('data-rot')) || -135;
                document.body.style.cursor = 'ns-resize';
            });
        });

        window.addEventListener('mousemove', (e) => {
            if (!activeDial) return;
            const deltaY = startY - e.clientY;
            let newAngle = currentAngle + (deltaY * 2);
            newAngle = Math.max(-135, Math.min(135, newAngle));
            
            activeDial.style.transform = `rotate(${newAngle}deg)`;
            activeDial.setAttribute('data-rot', newAngle);
            
            startY = e.clientY;
            currentAngle = newAngle;
        });

        window.addEventListener('mouseup', () => {
            activeDial = null;
            document.body.style.cursor = 'default';
        });

        function resetKnobs() {
            dials.forEach(dial => {
                dial.style.transform = `rotate(-135deg)`;
                dial.setAttribute('data-rot', -135);
            });
        }

        // 2. INTERACTIVE CABLE ENGINE
        const swatches = document.querySelectorAll('.color-swatch');
        let activeColor = '#ff3333';
        let patchStartNode = null;
        const cordLayer = document.getElementById('patch-bay-cords');

        swatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                document.querySelector('.color-swatch.selected').classList.remove('selected');
                swatch.classList.add('selected');
                activeColor = swatch.getAttribute('data-color');
                document.documentElement.style.setProperty('--active-color', activeColor);
            });
        });

        const jacks = document.querySelectorAll('.interactive-jack');
        
        jacks.forEach(jack => {
            jack.addEventListener('click', (e) => {
                e.stopPropagation();
                
                const cx = parseFloat(jack.getAttribute('cx'));
                const cy = parseFloat(jack.getAttribute('cy'));

                if (!patchStartNode) {
                    patchStartNode = { x: cx, y: cy, element: jack };
                    jack.classList.add('active-source');
                } else {
                    if (patchStartNode.element !== jack) {
                        const cord = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        
                        const dx = cx - patchStartNode.x;
                        const ctrlX = patchStartNode.x + dx / 2;
                        const ctrlY = Math.max(patchStartNode.y, cy) + Math.abs(dx) * 0.2 + 40;
                        
                        cord.setAttribute('d', `M ${patchStartNode.x} ${patchStartNode.y} Q ${ctrlX} ${ctrlY} ${cx} ${cy}`);
                        cord.setAttribute('class', 'patch-cable');
                        cord.setAttribute('style', `stroke: ${activeColor}; fill: none; stroke-width: 4px;`);
                        
                        cord.addEventListener('contextmenu', (evt) => {
                            evt.preventDefault();
                            cord.remove();
                        });

                        cordLayer.appendChild(cord);
                    }
                    
                    patchStartNode.element.classList.remove('active-source');
                    patchStartNode = null;
                }
            });
        });

        // Click off to cancel
        document.querySelector('.flowchart-svg').addEventListener('click', () => {
            if (patchStartNode) {
                patchStartNode.element.classList.remove('active-source');
                patchStartNode = null;
            }
        });

        function clearCables() {
            cordLayer.innerHTML = '';
        }
    </script>
</body>
</html>
