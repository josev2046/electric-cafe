<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DS-10 UI Shell</title>
  <style>
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: monospace;
      user-select: none; /* Prevent text selection while dragging knobs */
    }

    /* Nintendo DS Screen Dimensions (Scaled up) */
    .screen {
      width: 512px;
      height: 384px;
      background: #222;
      border: 4px solid #444;
      border-radius: 8px;
      margin: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px #000;
    }

    /* TOP SCREEN: Display area */
    .top-screen {
      background: #0a1a10;
      color: #4af55d;
      padding: 20px;
      box-sizing: border-box;
    }

    .lcd-text {
      font-size: 24px;
      margin: 0;
      text-shadow: 0 0 5px #4af55d;
    }

    /* BOTTOM SCREEN: Touch Controls */
    .bottom-screen {
      background: #333;
      display: flex;
      padding: 20px;
      box-sizing: border-box;
      gap: 30px;
    }

    /* --- Custom Rotary Knob --- */
    .knob-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }
    
    .knob {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #555, #222);
      border-radius: 50%;
      border: 3px solid #111;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
      position: relative;
      cursor: grab;
      /* Start at bottom left (-135deg) */
      transform: rotate(-135deg); 
    }
    
    .knob:active {
      cursor: grabbing;
    }

    .knob-indicator {
      position: absolute;
      width: 6px;
      height: 20px;
      background: #fff;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 3px;
    }

    /* --- Kaoss Pad --- */
    .kaoss-pad {
      flex-grow: 1;
      background: #111;
      border: 2px solid #555;
      position: relative;
      touch-action: none; /* Prevent scrolling on mobile */
      cursor: crosshair;
    }
    
    .kaoss-cursor {
      width: 20px;
      height: 20px;
      background: rgba(255, 0, 0, 0.8);
      border: 2px solid #fff;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      box-shadow: 0 0 15px red;
    }
  </style>
</head>
<body>

  <!-- TOP SCREEN (Non-touch, visual feedback) -->
  <div class="screen top-screen">
    <p class="lcd-text">KORG DS-10 VIRTUAL</p>
    <p class="lcd-text" id="display">CUTOFF: 2000Hz</p>
    <p class="lcd-text" id="kaoss-display">X: 0.00 | Y: 0.00</p>
  </div>

  <!-- BOTTOM SCREEN (Touch interface) -->
  <div class="screen bottom-screen">
    
    <!-- Rotary Knob -->
    <div class="knob-container">
      <div class="knob" id="cutoff-knob">
        <div class="knob-indicator"></div>
      </div>
      <p>CUTOFF</p>
    </div>

    <!-- Kaoss Pad -->
    <div class="kaoss-pad" id="kaoss-pad">
      <div class="kaoss-cursor" id="kaoss-cursor"></div>
    </div>

  </div>

<script>
  // --- KNOB LOGIC ---
  const knob = document.getElementById('cutoff-knob');
  const display = document.getElementById('display');
  
  let isDraggingKnob = false;
  let startY = 0;
  let currentRotation = -135; // Min rotation
  const minRot = -135;
  const maxRot = 135;

  knob.addEventListener('pointerdown', (e) => {
    isDraggingKnob = true;
    startY = e.clientY;
    knob.setPointerCapture(e.pointerId);
  });

  knob.addEventListener('pointermove', (e) => {
    if (!isDraggingKnob) return;
    
    // Calculate movement delta
    const deltaY = startY - e.clientY;
    startY = e.clientY; // Reset for continuous movement
    
    // Apply delta to rotation (adjust multiplier for sensitivity)
    currentRotation += deltaY * 1.5; 
    
    // Clamp values
    if (currentRotation < minRot) currentRotation = minRot;
    if (currentRotation > maxRot) currentRotation = maxRot;
    
    // Update visuals
    knob.style.transform = `rotate(${currentRotation}deg)`;
    
    // Map rotation (-135 to 135) to Audio Parameter (e.g., 100Hz to 8000Hz)
    const normalized = (currentRotation - minRot) / (maxRot - minRot);
    const cutoffFreq = Math.floor(100 + (normalized * 7900));
    display.innerText = `CUTOFF: ${cutoffFreq}Hz`;
  });

  knob.addEventListener('pointerup', () => isDraggingKnob = false);
  knob.addEventListener('pointercancel', () => isDraggingKnob = false);

  // --- KAOSS PAD LOGIC ---
  const pad = document.getElementById('kaoss-pad');
  const cursor = document.getElementById('kaoss-cursor');
  const kaossDisplay = document.getElementById('kaoss-display');
  
  let isPadActive = false;

  function updateKaoss(e) {
    if (!isPadActive) return;
    
    // Get bounding box to calculate relative coordinates
    const rect = pad.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    // Clamp to boundaries
    x = Math.max(0, Math.min(x, rect.width));
    y = Math.max(0, Math.min(y, rect.height));

    // Move visual cursor
    cursor.style.left = `${x}px`;
    cursor.style.top = `${y}px`;

    // Normalize values 0.0 to 1.0 (Note: Web Audio usually maps Y inverted, bottom is lower)
    const normX = (x / rect.width).toFixed(2);
    const normY = (1 - (y / rect.height)).toFixed(2);
    
    kaossDisplay.innerText = `X: ${normX} | Y: ${normY}`;
  }

  pad.addEventListener('pointerdown', (e) => {
    isPadActive = true;
    cursor.style.display = 'block';
    pad.setPointerCapture(e.pointerId);
    updateKaoss(e);
  });

  pad.addEventListener('pointermove', updateKaoss);

  pad.addEventListener('pointerup', () => {
    isPadActive = false;
    cursor.style.display = 'none';
  });
</script>
</body>
</html>
